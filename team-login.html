<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>espace équipe - nwes productions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --charcoal: #282828;
    --orange: #FCA72E;
    --blue-deep: #1B5B85;
    --orange-light: #FFC672;
    --off-white: #FDFDFD;
    --gray-light: #F2F2F2;
    --gray-mid: #8A8A8A;

    --font: 'Montserrat', Arial, Helvetica, sans-serif;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font);
    font-weight: 400;
    color: var(--charcoal);
    background: var(--charcoal);
    -webkit-font-smoothing: antialiased;
  }

  .login-card {
    width: 100%;
    max-width: 360px;
    margin: 24px;
    background: var(--off-white);
    border-radius: var(--radius);
    padding: 40px 32px;
  }

  .logo {
    display: block;
    font-weight: 700;
    font-size: 20px;
    text-transform: lowercase;
    color: var(--charcoal);
    text-decoration: none;
    margin-bottom: 28px;
  }
  .logo span { color: var(--orange); }

  h1 {
    font-family: var(--font);
    font-weight: 700;
    font-size: 22px;
    text-transform: lowercase;
    margin: 0 0 8px 0;
  }
  h1 span { color: var(--orange); }

  p.intro {
    font-size: 14px;
    color: var(--gray-mid);
    margin: 0 0 24px 0;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: lowercase;
    color: var(--charcoal);
    margin-bottom: 8px;
  }

  input[type="password"] {
    width: 100%;
    font-family: var(--font);
    font-size: 15px;
    padding: 14px 16px;
    border-radius: var(--radius);
    border: 1.5px solid rgba(40,40,40,0.18);
    background: var(--gray-light);
    color: var(--charcoal);
    outline: none;
    transition: border-color 0.2s ease;
  }
  input[type="password"]:focus { border-color: var(--orange); }

  .btn {
    width: 100%;
    margin-top: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font);
    font-weight: 700;
    font-size: 14px;
    text-transform: lowercase;
    letter-spacing: 0.02em;
    padding: 15px 32px;
    border-radius: 100px;
    border: none;
    background: var(--orange);
    color: var(--blue-deep);
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .btn:hover { background: var(--orange-light); transform: translateY(-2px); }
  .btn:disabled { opacity: 0.6; cursor: default; transform: none; }

  .error {
    display: none;
    margin-top: 14px;
    font-size: 13px;
    font-weight: 700;
    color: #C0392B;
  }
  .error.is-visible { display: block; }
</style>
</head>
<body>

<div class="login-card">
  <a href="index.html" class="logo">nwes<span>.</span>productions</a>
  <h1>espace <span>équipe</span></h1>
  <p class="intro">entre le mot de passe pour accéder à l'espace équipe.</p>

  <form id="loginForm">
    <label for="password">mot de passe</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
    <button type="submit" class="btn" id="submitBtn">accéder</button>
    <p class="error" id="errorMsg">mot de passe incorrect, réessaie.</p>
  </form>
</div>

<script>
  var form = document.getElementById('loginForm');
  var submitBtn = document.getElementById('submitBtn');
  var errorMsg = document.getElementById('errorMsg');
  var passwordInput = document.getElementById('password');

  var params = new URLSearchParams(location.search);
  var redirectTo = params.get('next') || '/team';

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorMsg.classList.remove('is-visible');
    submitBtn.disabled = true;

    fetch('/api/team-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: passwordInput.value }),
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (result) {
        if (result.ok) {
          window.location.href = redirectTo;
        } else {
          submitBtn.disabled = false;
          errorMsg.classList.add('is-visible');
          passwordInput.select();
        }
      })
      .catch(function () {
        submitBtn.disabled = false;
        errorMsg.textContent = 'une erreur est survenue, réessaie.';
        errorMsg.classList.add('is-visible');
      });
  });
</script>

</body>
</html>
